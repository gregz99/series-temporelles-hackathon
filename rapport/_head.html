<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Validation des modèles de séries temporelles par simulation</title>
<style>
  @page { size: A4; margin: 22mm 20mm 22mm 20mm;
          @bottom-center { content: counter(page); font: 9pt "Segoe UI", sans-serif; color: #666; } }
  @page :first { @bottom-center { content: ""; } }
  html { font-family: "Cambria", "Georgia", serif; font-size: 10.6pt; line-height: 1.45; color: #1a1a1a; }
  body { margin: 0; }
  h1, h2, h3 { font-family: "Segoe UI", "Calibri", sans-serif; color: #12355b; line-height: 1.2; }
  h1 { font-size: 17pt; margin: 1.4em 0 0.5em; border-bottom: 2px solid #12355b; padding-bottom: 4px; break-after: avoid-page; }
  h2, h3 { break-after: avoid-page; }
  h1.newpage { page-break-before: always; }
  h1.first { page-break-before: auto; }
  h2 { font-size: 12.5pt; margin: 1.3em 0 0.4em; }
  h3 { font-size: 11pt; margin: 1.1em 0 0.3em; }
  p { margin: 0.5em 0; text-align: left; }
  .katex { font-size: 1.02em; }
  .titlepage { text-align: center; padding-top: 55mm; page-break-after: always; }
  .titlepage .kicker { font-family: "Segoe UI", sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #666; font-size: 10pt; }
  .titlepage h1 { border: none; page-break-before: auto; font-size: 25pt; margin: 14mm 0 6mm; }
  .titlepage .sub { font-size: 14pt; color: #444; margin-bottom: 30mm; font-style: italic; }
  .titlepage .team { font-family: "Segoe UI", sans-serif; font-size: 12pt; line-height: 1.8; }
  .titlepage .meta { margin-top: 24mm; color: #555; font-size: 10.5pt; }
  .abstract { border-left: 4px solid #12355b; background: #f3f6fa; padding: 8px 14px; margin: 1em 0; }
  figure { margin: 1em 0; page-break-inside: avoid; text-align: center; }
  figure img { max-width: 100%; }
  figcaption { font-size: 9.2pt; color: #444; margin-top: 4px; text-align: left; }
  table { border-collapse: collapse; margin: 0.8em auto; font-size: 9.6pt; page-break-inside: avoid; font-family: "Segoe UI", "Calibri", sans-serif; }
  th, td { border: 1px solid #c8d0da; padding: 3px 8px; text-align: center; }
  th { background: #e8eef6; }
  td.l, th.l { text-align: left; }
  caption { caption-side: top; font-size: 9.2pt; color: #444; padding-bottom: 4px; text-align: left; }
  .bad { background: #fbe3e0; } .good { background: #e3f2e6; } .mid { background: #fdf3d6; }
  .note { font-size: 9.4pt; color: #444; }
  .eq { text-align: center; margin: 0.6em 0; font-style: italic; }
  ul, ol { margin: 0.4em 0 0.6em 1.3em; padding: 0; }
  li { margin: 0.2em 0; }
  code { font-family: "Consolas", monospace; font-size: 9.2pt; background: #f1f1f1; padding: 0 3px; }
  .two { display: flex; gap: 10px; }
  .two figure { flex: 1; }
  .refs li { font-size: 9.4pt; }
  .small { font-size: 9.2pt; }
  td.num { font-variant-numeric: tabular-nums; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  renderMathInElement(document.body, {delimiters: [{left: "$", right: "$", display: false}], throwOnError: false});
});
</script>
</head>
